<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ConVos · Consola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
:root{--ink:#150B33;--ink-2:#20144A;--ink-3:#2F2166;--violet:#6D28D9;--orange:#FB923C;--rose:#F43F5E;--cream:#F5EBDD;--mint:#34D399;--amber:#FBBF24;--mute:#B9B1DC;--line:rgba(245,235,221,.14);
  --grad:linear-gradient(135deg,#FB923C 0%,#FA6A4D 50%,#F43F5E 100%);--fd:'Oswald','Arial Narrow',Impact,sans-serif;--fb:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--cream);font-family:var(--fb);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding:14px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
[hidden]{display:none!important}
.card{background:var(--ink-2);border-radius:22px;padding:20px}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:4px 6px}
.brand{display:flex;align-items:center;gap:10px;font:600 20px var(--fd);letter-spacing:.03em;margin-right:auto}
.brand svg{width:26px;height:26px}.brand small{font:500 12px var(--fb);color:var(--mute);letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;background:var(--ink-2);font-size:13px;color:var(--mute)}
.pill b{color:var(--cream);font:600 15px var(--fd);letter-spacing:.02em}
.pill.ok b{color:var(--mint)}.pill.warn b{color:var(--amber)}.pill.bad b{color:var(--rose)}
.timer{display:flex;align-items:center;gap:8px}
.timer button{padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);font-size:13px;font-weight:600}
#tEl{font:600 26px var(--fd);letter-spacing:.02em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute);display:inline-block}
.dot.online,.dot.sim{background:var(--mint)}.dot.offline{background:var(--rose)}

/* centro */
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;min-height:0}
.now{display:flex;flex-direction:column;gap:14px;overflow:auto}
.kick{font:600 12px var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
h1{margin:0;font:600 clamp(40px,5.4vw,84px)/1 var(--fd)}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:rgba(245,235,221,.18);transition:background .3s}.dots i.on{background:var(--orange)}.dots i.cur{background:var(--grad);box-shadow:0 0 0 4px rgba(251,146,60,.25)}
ul.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.notes li{font-size:clamp(17px,1.7vw,24px);line-height:1.35;padding-left:18px;position:relative;color:var(--mute);transition:color .3s}
ul.notes li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--line)}
ul.notes li.cur{color:var(--cream)}ul.notes li.cur::before{background:var(--orange)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.pair div{background:var(--ink);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.4;color:var(--mute)}
.pair b{display:block;color:var(--cream);font:600 12px var(--fb);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.side{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.next h2{margin:6px 0 4px;font:600 30px/1.05 var(--fd)}
.next p{margin:0;color:var(--mute);font-size:14px}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
.btns button{padding:18px 14px;border-radius:18px;font:600 17px var(--fb);text-align:center;border:1.5px solid var(--line)}
.btns .go{background:var(--grad);color:var(--ink);border:0;font-size:20px}
.sub{font:600 12px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.ops{display:flex;flex-direction:column;gap:8px}
.op{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--ink);border:1.5px solid transparent}
.op b{display:block;font-size:15px}.op small{display:block;margin-top:2px;color:var(--mute);font-size:12.5px;line-height:1.35}
.op i{font:600 12px var(--fb);font-style:normal;padding:4px 10px;border-radius:99px;background:rgba(245,235,221,.1);color:var(--mute);flex:none}
.op.on{border-color:rgba(251,146,60,.6)}.op.on i{background:var(--grad);color:var(--ink)}
.stpr{display:flex;align-items:center;gap:8px;flex:none}.stpr button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);text-align:center;font:600 20px var(--fb);line-height:1}.stpr i{min-width:28px;text-align:center;font:600 20px var(--fd);padding:0;background:none;color:var(--cream)}
details summary{cursor:pointer;color:var(--mute);font-size:13px;margin:10px 2px 0;list-style:none}details summary::-webkit-details-marker{display:none}
.match{border-left:4px solid var(--mute)}.match.ok{border-color:var(--mint)}.match.warn{border-color:var(--amber)}.match.bad{border-color:var(--rose)}
.match b{font-size:15px}.match p{margin:4px 0 0;color:var(--mute);font-size:13px}

/* tira de escenas */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;align-items:center}
.strip .act{font:600 11px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:0 8px 0 10px;flex:none}
.chip{flex:none;padding:9px 13px;border-radius:99px;background:var(--ink-2);font-size:13px;font-weight:600;border:1.5px solid transparent;white-space:nowrap}
.chip small{color:var(--mute);font-weight:500;margin-left:6px}
.chip.past{opacity:.5}.chip.cur{background:var(--grad);color:var(--ink)}.chip.cur small{color:rgba(21,11,51,.7)}
.foot{font-size:11.5px;color:var(--mute);padding:0 6px 2px}
#nokey{background:rgba(244,63,94,.16);border:1.5px solid var(--rose);border-radius:16px;padding:12px 16px;font-size:14px}
@media (max-width:900px){main{grid-template-columns:1fr}body{padding:10px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 12C13 27 22 37 32 49" fill="none" stroke="#FB923C" stroke-width="8" stroke-linecap="round"/><path d="M52 12C51 27 42 37 32 49" fill="none" stroke="#F5EBDD" stroke-width="8" stroke-linecap="round"/><circle cx="12" cy="12" r="6" fill="#FB923C"/><circle cx="52" cy="12" r="6" fill="#F5EBDD"/><circle cx="32" cy="53" r="7.5" fill="#F43F5E" stroke="#150B33" stroke-width="3"/></svg>ConVos <small>Consola del presentador</small></div>
  <div class="timer"><span id="tEl">00:00</span><span class="pill" id="tOf">de 08:00</span><span class="pill" id="pace"><b>—</b></span><button type="button" id="tBtn">Iniciar</button><button type="button" id="tRst" title="Pone el cronómetro en cero">Reiniciar</button></div>
  <div class="pill" title="Celulares conectados"><b id="aCon">0</b> conectados</div>
  <div class="pill" title="Celulares que tocaron algo en esta escena"><b id="aTry">0</b> lo probaron</div>
  <div class="pill" title="Celulares que contestaron dónde viven"><b id="aAns">0</b> respondieron</div>
  <div class="pill"><span class="dot" id="dot"></span><span id="stt">conectando</span></div>
</header>

<main>
  <section class="card now">
    <div class="kick" id="kick"></div>
    <h1 id="nT"></h1>
    <div class="dots" id="dots"></div>
    <ul class="notes" id="notes"></ul>
    <div class="pair"><div><b>Proyector</b><span id="nProj"></span></div><div><b>Celular</b><span id="nCel"></span></div></div>
  </section>

  <aside class="side">
    <div id="nokey" hidden>Falta la clave del presentador. Abrí el enlace que está en <b>private/URL-presentador.txt</b>.</div>
    <section class="card next">
      <div class="kick" id="xKick">Sigue</div>
      <h2 id="xT"></h2><p id="xP"></p>
      <div class="btns"><button type="button" id="bPrev">← Anterior</button><button type="button" class="go" id="bNext">Siguiente →</button></div>
    </section>
    <section class="card match" id="matchCard" hidden><p class="sub" style="margin:0 0 6px">Match</p><b id="mT"></b><p id="mP"></p></section>
    <section class="card">
      <div id="nowWrap"><p class="sub">Opciones para este momento</p><div class="ops" id="opsNow"></div></div>
      <details id="moreWrap"><summary>Más opciones</summary><div class="ops" id="opsMore" style="margin-top:8px"></div></details>
    </section>
  </aside>
</main>

<footer>
  <nav class="strip" id="strip" aria-label="Escenas"></nav>
  <div class="foot" id="foot"></div>
</footer>

<script src="locs.js"></script><script src="show.js"></script><script src="config.js"></script><script src="sync.js"></script>
<script>
(function(){
'use strict';
const R=window.ConvosRoom,SHOW=R.SHOW,ACTS=window.CONVOS_ACTS||{},TOTAL=window.CONVOS_TOTAL_SECS||480,$=(s,r=document)=>r.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};

/* la clave de firma entra por el enlace del presentador y se saca enseguida de la barra de direcciones */
let priv=null;
try{const m=/[#&]k=([A-Za-z0-9+/=]{100,400})/.exec(location.hash);
  if(m){sessionStorage.setItem('convosPK',m[1]);history.replaceState(null,'',location.pathname+location.search);}
  priv=sessionStorage.getItem('convosPK');}catch(_){}
$('#nokey').hidden=!!priv;
const room=R.connect({role:'presenter'});

/* una lista plana de pasos: cada "Siguiente" avanza uno */
const flat=[];SHOW.forEach((d,i)=>{for(let k=0;k<(d.steps||1);k++)flat.push({i,k});});
const firstOf=i=>flat.findIndex(x=>x.i===i);
const OPTS={
  qr:{t:'Mostrar QR',on:'Ocultar QR',d:'Código grande en el proyector para que entren desde el celular.',toggle:true},
  names:{t:'Nombres en el mapa',d:'Muestra u oculta los apodos sobre cada punto.',toggle:true},
  fill:{t:'Compañeros de ejemplo',d:'Suma o saca gente de ejemplo de a uno. Si entra poca gente, el mapa no queda vacío. Se ven con borde punteado.',stepper:true},
  fit:{t:'Encuadrar mapa',d:'Ajusta el mapa del proyector para que se vea a toda la sala.'},
  skip:{t:'Saltear esta escena',d:'Pasa directo a la siguiente, sin mostrarla.'}
};
let pos=0,fillN=window.CONVOS_FILL||6,names=true,qrBig=false,seq=Date.now(),real=[],stats={connected:0,answered:0,interacted:0};
let run=false,tStart=0,acc=0,sceneAt=0;
try{const p=+sessionStorage.getItem('convosPos');if(p>=0&&p<flat.length)pos=p;const q=sessionStorage.getItem('convosFill');if(q!==null&&+q>=0&&+q<=R.FILLERS.length)fillN=+q;}catch(_){}
const elapsed=()=>acc+(run?Date.now()/1000-tStart:0);
const cur=()=>SHOW[flat[pos].i];
const state=id=>id==='qr'?qrBig:id==='names'?names:id==='fill'?fillN>0:false;
const label=id=>id==='qr'&&qrBig?OPTS.qr.on:OPTS[id].t;

async function publish(refit){
  const {k}=flat[pos],f=(names?0:1)|(qrBig?2:0)|(refit?4:0);
  try{sessionStorage.setItem('convosPos',String(pos));sessionStorage.setItem('convosFill',String(fillN));}catch(_){}
  if(priv)await room.publishScene(priv,cur().id,k,fillN,f,++seq);
  paint();
}
function go(p){
  p=Math.max(0,Math.min(flat.length-1,p));
  if(flat[p].i!==flat[pos].i)sceneAt=elapsed();
  if(p!==pos&&!run&&p>0)toggleTimer();   // el cronómetro arranca solo con el primer avance
  pos=p;publish();
}
const next=()=>go(pos+1),prev=()=>go(pos-1);
const skip=()=>go(firstOf(Math.min(SHOW.length-1,flat[pos].i+1)));
function act(id){
  if(id==='qr'){qrBig=!qrBig;publish();}
  else if(id==='names'){names=!names;publish();}
  else if(id==='fill+'){fillN=Math.min(R.FILLERS.length,fillN+1);publish();}
  else if(id==='fill-'){fillN=Math.max(0,fillN-1);publish();}
  else if(id==='fit')publish(true);
  else if(id==='skip')skip();
}

/* ---------- cronómetro ---------- */
function toggleTimer(){if(run){acc=elapsed();run=false;}else{tStart=Date.now()/1000;run=true;}paintTimer();}
function paintTimer(){
  const e=elapsed();$('#tEl').textContent=mmss(e);$('#tOf').textContent='de '+mmss(TOTAL);$('#tBtn').textContent=run?'Pausar':'Iniciar';
  const {i,k}=flat[pos],d=SHOW[i];
  const done=SHOW.slice(0,i).reduce((t,x)=>t+x.secs,0)+d.secs*(k/(d.steps||1)),delta=e-done,p=$('#pace'),b=p.querySelector('b');
  p.className='pill'+(!run&&e===0?'':Math.abs(delta)<=10?' ok':delta>0?(delta>30?' bad':' warn'):' ok');
  b.textContent=(!run&&e===0)?'—':Math.abs(delta)<=10?'En tiempo':delta>0?'Atrasado '+mmss(delta):'Adelantado '+mmss(-delta);
}

/* ---------- pantalla ---------- */
function people(){return real.map(p=>({...p,sim:false})).concat(R.FILLERS.slice(0,fillN)).map(p=>({...p,pt:R.pointOf(p)})).filter(p=>p.pt);}
function paintMatch(){
  const d=cur(),show=d.id==='pregunta'||d.id==='match';$('#matchCard').hidden=!show;if(!show)return;
  const all=people(),pl=R.plan(all),g=pl.groups.length,mem=pl.groups.map(x=>[all[x.driver],...x.members.map(i=>all[i])]);
  const n=mem.reduce((t,x)=>t+x.length,0),re=mem.reduce((t,x)=>t+x.filter(p=>!p.sim).length,0),c=$('#matchCard');
  const ok=g&&re;c.className='card match '+(!g?'bad':ok?'ok':'warn');
  $('#mT').textContent=!g?'Todavía no hay match':g+(g===1?' grupo posible':' grupos posibles');
  $('#mP').textContent=!g?'Conviene saltear la escena “Match”.':(re?n+' personas, '+re+' reales.':'Son todos de ejemplo. Conviene esperar más respuestas o saltear.');
}
function paint(){
  const {i,k}=flat[pos],d=SHOW[i],steps=d.steps||1,nx=flat[pos+1],nd=nx?SHOW[nx.i]:null;
  $('#kick').textContent=(ACTS[d.act]?(d.act?'Acto '+d.act+' · ':'')+ACTS[d.act]:'')+' · '+(i+1)+' de '+SHOW.length;   // el acto 0 es la previa
  $('#nT').textContent=d.label;
  $('#dots').innerHTML=steps>1?Array.from({length:steps},(_,j)=>'<i class="'+(j<k?'on':j===k?'cur':'')+'"></i>').join(''):'';
  $('#notes').innerHTML=(d.notes||[]).map((n,j)=>'<li class="'+(steps>1?(j===Math.min(k,d.notes.length-1)?'cur':''):'cur')+'">'+esc(n)+'</li>').join('');
  $('#nProj').textContent=d.proj||'—';$('#nCel').textContent=d.cel||'—';
  if(nd){const same=nx.i===i;$('#xKick').textContent=same?'Siguiente paso · '+(nx.k+1)+' de '+steps:'Sigue';$('#xT').textContent=same?d.label:nd.label;$('#xP').textContent=same?(d.proj||''):(nd.desc||nd.proj||'');}
  else{$('#xKick').textContent='Final';$('#xT').textContent='Fin de la presentación';$('#xP').textContent='';}
  $('#bNext').disabled=!priv||!nx;$('#bPrev').disabled=!priv||pos===0;
  const sug=d.opts||[],rest=Object.keys(OPTS).filter(x=>!sug.includes(x));
  const row=id=>{const o=OPTS[id],on=state(id);
    if(o.stepper)return '<div class="op stp'+(on?' on':'')+'"><span><b>'+esc(o.t)+'</b><small>'+esc(o.d)+'</small></span><span class="stpr"><button type="button" data-o="fill-"'+(priv&&fillN>0?'':' disabled')+' aria-label="Sacar uno">−</button><i>'+fillN+'</i><button type="button" data-o="fill+"'+(priv&&fillN<R.FILLERS.length?'':' disabled')+' aria-label="Sumar uno">+</button></span></div>';
    return '<button type="button" class="op'+(on?' on':'')+'" data-o="'+id+'"'+(priv?'':' disabled')+'><span><b>'+esc(label(id))+'</b><small>'+esc(o.d)+'</small></span>'+(o.toggle?'<i>'+(on?'Sí':'No')+'</i>':'')+'</button>';};
  $('#opsNow').innerHTML=sug.map(row).join('');$('#nowWrap').hidden=!sug.length;
  $('#opsMore').innerHTML=rest.map(row).join('');$('#moreWrap').hidden=!rest.length;
  let h='',act=-1;SHOW.forEach((x,j)=>{if(x.act!==act){act=x.act;h+='<span class="act">'+esc(ACTS[act]||'Acto '+act)+'</span>';}h+='<button type="button" class="chip'+(j===i?' cur':j<i?' past':'')+'" data-i="'+j+'"'+(priv?'':' disabled')+'>'+esc(x.label)+'<small>'+x.secs+'s</small></button>';});
  $('#strip').innerHTML=h;const c=$('#strip .cur');if(c)c.scrollIntoView({inline:'center',block:'nearest'});
  paintMatch();paintTimer();
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='bNext')next();else if(b.id==='bPrev')prev();else if(b.id==='tBtn')toggleTimer();
  else if(b.id==='tRst'){acc=0;run=false;sceneAt=0;paintTimer();}
  else if(b.dataset.o)act(b.dataset.o);
  else if(b.dataset.i!==undefined)go(firstOf(+b.dataset.i));
  b.blur();
});
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||!priv)return;
  const k=e.key.toLowerCase();
  if(k==='arrowright'||k==='pagedown'||k===' '||k==='enter'){e.preventDefault();next();}
  else if(k==='arrowleft'||k==='pageup'||k==='backspace'){e.preventDefault();prev();}
  else if(k==='q')act('qr');else if(k==='n')act('names');else if(k==='+'||k==='=')act('fill+');else if(k==='-')act('fill-');else if(k==='e')act('fit');
  else if(k==='p')toggleTimer();
});
room.onPeople(l=>{real=l;paintMatch();});
room.onStats(s=>{stats=s;$('#aCon').textContent=s.connected;$('#aTry').textContent=s.interacted;$('#aAns').textContent=s.answered;});
room.onStatus(s=>{$('#dot').className='dot '+s;$('#stt').textContent=({sim:'ensayo (sin red)',online:'en vivo',connecting:'conectando',offline:'sin conexión'})[s]||s;});
room.start();
setInterval(paintTimer,500);
const base=new URL('./',location.href);$('#foot').textContent='Proyector: '+new URL('sala.html',base).href+'   ·   Público: '+base.href+'   ·   Teclas: → siguiente · ← anterior · Q QR · N nombres · + / − compañeros de ejemplo · E encuadrar · P cronómetro';
paint();if(priv)publish();
})();
</script>
</body>
</html>
