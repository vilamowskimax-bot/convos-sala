<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ConVos · Consola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
/* Se mira de lejos: pocas cosas y muy grandes. Tiempo, celulares, si la tele está al día, la escena y un botón. */
:root{--ink:#150B33;--ink-2:#20144A;--orange:#FB923C;--rose:#F43F5E;--cream:#F5EBDD;--mint:#34D399;--amber:#FBBF24;--mute:#B9B1DC;--line:rgba(245,235,221,.14);
  --grad:linear-gradient(135deg,#FB923C 0%,#FA6A4D 50%,#F43F5E 100%);--fd:'Oswald','Arial Narrow',Impact,sans-serif;--fb:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--cream);font-family:var(--fb);min-height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:2.2vh;padding:2.5vh 3vw;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
button:disabled{opacity:.35;cursor:not-allowed}
[hidden]{display:none!important}

/* arriba: el tiempo enorme y dos indicadores */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:2vh 2.5vw}
.clock{margin-right:auto;display:flex;align-items:baseline;gap:1.4vw}
.clock b{font:600 clamp(88px,14vw,220px)/.85 var(--fd);letter-spacing:.01em}
.clock.warn b{color:var(--amber)}.clock.bad b{color:var(--rose)}
.clock span{font-size:clamp(18px,1.7vw,26px);color:var(--mute);display:flex;flex-direction:column;gap:8px}
.clock button{font-weight:600;color:var(--cream);border:2px solid var(--line);border-radius:99px;padding:6px 16px;font-size:inherit}
.stat{display:flex;align-items:center;gap:14px;padding:16px 26px;border-radius:26px;background:var(--ink-2);font-size:clamp(18px,1.8vw,28px);color:var(--mute);font-weight:500}
.stat b{font:600 clamp(44px,5vw,76px)/1 var(--fd);color:var(--cream)}
.dot{width:24px;height:24px;border-radius:50%;background:var(--mute);flex:none}
#tele{color:var(--cream)}#tele.ok .dot{background:var(--mint)}#tele.warn .dot{background:var(--amber)}#tele.bad{background:rgba(244,63,94,.28)}#tele.bad .dot{background:var(--rose)}

/* centro: dónde estoy y una frase */
.stage{display:flex;flex-direction:column;justify-content:center;gap:2vh;min-height:0}
.num{font:600 clamp(22px,2.2vw,34px) var(--fd);letter-spacing:.12em;color:var(--mute)}
.num b{color:var(--orange)}
h1{margin:0;font:600 clamp(64px,10vw,160px)/.92 var(--fd)}
.dots{display:flex;gap:12px}.dots i{width:20px;height:20px;border-radius:50%;background:rgba(245,235,221,.18)}.dots i.on{background:var(--orange)}.dots i.cur{background:var(--grad);box-shadow:0 0 0 5px rgba(251,146,60,.25)}
.cue p{margin:0 0 .3em;font-size:clamp(24px,2.9vw,44px);line-height:1.25;max-width:32ch;transition:opacity .4s}
.cue p.later{opacity:.38}
/* si lo que hay que decir no entra, se achica (fit) */
.stage.many{gap:1.3vh}.stage.many h1{font-size:clamp(46px,6vw,100px)}.stage.many .cue p{font-size:clamp(17px,1.65vw,27px);max-width:56ch;margin-bottom:.2em}
.stage.tight h1{font-size:clamp(40px,4.6vw,76px)}.stage.tight .cue p{font-size:clamp(15px,1.3vw,21px)}
/* en una compu, todo entra en la pantalla: el botón nunca se va para abajo */
@media (min-width:900px){body{height:100vh;height:100dvh;min-height:0}.stage{overflow:auto;justify-content:safe center}}
.match{font-size:clamp(20px,2vw,30px);color:var(--mute)}.match b{color:var(--cream)}

/* abajo: un botón gigante */
.go{display:grid;grid-template-columns:clamp(90px,10vw,150px) minmax(0,1fr);gap:1.4vw}
.go button{border-radius:30px;text-align:center}
#bPrev{border:2px solid var(--line);font-size:clamp(36px,4vw,60px)}
#bNext{background:var(--grad);color:var(--ink);min-height:20vh;font:600 clamp(44px,6vw,92px)/1 var(--fd);letter-spacing:.02em}
#bNext small{display:block;font:500 clamp(18px,1.7vw,26px) var(--fb);letter-spacing:0;opacity:.75;margin-top:.5vh}
#nokey{background:rgba(244,63,94,.18);border:2px solid var(--rose);border-radius:18px;padding:14px 18px;font-size:18px}

/* plegado, chico: guion, opciones y escenas */
.more{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-start}
details summary{cursor:pointer;color:var(--mute);font-size:15px;list-style:none}details summary::-webkit-details-marker{display:none}
details summary::after{content:" ▾"}details[open] summary::after{content:" ▴"}
.full{margin-top:10px;background:var(--ink-2);border-radius:18px;padding:14px 18px;font-size:16px;line-height:1.45;color:var(--mute);max-width:80ch}
.full ol{margin:0 0 8px;padding-left:20px;color:var(--cream)}.full b{color:var(--cream)}
.ops,.strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.op{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:99px;background:var(--ink-2);font-size:14px;font-weight:600;border:1.5px solid transparent}
.op.on{border-color:rgba(251,146,60,.6)}.op i{font-style:normal;color:var(--mute);font-weight:500}
.stp button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);line-height:1}
.chip{padding:7px 12px;border-radius:99px;background:var(--ink-2);font-size:13px;font-weight:600}
.chip.past{opacity:.5}.chip.cur{background:var(--grad);color:var(--ink)}
.keys{margin-top:10px;font-size:12.5px;color:var(--mute)}
#bReset{margin-left:auto;padding:6px 14px;border:1.5px solid var(--line);border-radius:99px;font-size:14px;color:var(--mute)}
#bReset:hover:not(:disabled){color:var(--cream);border-color:var(--rose)}
</style>
</head>
<body>
<header class="top">
  <div class="clock" id="clock" title="Arranca solo con el primer Siguiente. Blanco: en tiempo · amarillo: algo atrasado · rojo: atrasado"><b id="tEl">00:00</b><span>de 8:00<button type="button" id="tBtn">Iniciar</button></span></div>
  <div class="stat" title="Celulares conectados"><b id="aCon">0</b>celulares</div>
  <div class="stat" id="tele" title="Si la tele recibe lo que pasás"><span class="dot"></span><span id="teleT">Tele</span></div>
</header>

<main class="stage">
  <div id="nokey" hidden>Falta la clave del presentador. Abrí el enlace que está en <b>private/URL-presentador.txt</b>.</div>
  <div class="num" id="num"></div>
  <h1 id="nT"></h1>
  <div class="dots" id="dots"></div>
  <div class="cue" id="cue"></div>
  <div class="match" id="match" hidden></div>
</main>

<div class="go"><button type="button" id="bPrev" aria-label="Anterior">←</button><button type="button" id="bNext">Siguiente →<small id="xT"></small></button></div>

<div class="more">
  <details><summary>Guion completo</summary><div class="full" id="full"></div></details>
  <details><summary>Más opciones</summary>
    <div class="ops" id="ops"></div>
    <nav class="strip" id="strip" aria-label="Escenas"></nav>
    <div class="keys" id="foot"></div>
  </details>
  <button type="button" id="bReset" title="Vuelve todo a la primera escena: la consola, la tele y los celulares (que olvidan lo que contestaron)">↺ Reiniciar todo</button>
</div>

<script src="locs.js?v=dc410bc9df"></script><script src="show.js?v=508e2c6a1d"></script><script src="config.js?v=81eed32057"></script><script src="sync.js?v=118cfce577"></script>
<script>
(function(){
'use strict';
const R=window.ConvosRoom,SHOW=R.SHOW,$=(s,r=document)=>r.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const first=t=>{const m=/^.*?[.!?](?=\s|$)/.exec(t);return m?m[0]:t;};   // en grande, solo la primera frase

/* la clave de firma entra por el enlace del presentador y se saca enseguida de la barra de direcciones */
let priv=null;
try{const m=/[#&]k=([A-Za-z0-9+/=]{100,400})/.exec(location.hash);
  if(m){sessionStorage.setItem('convosPK',m[1]);history.replaceState(null,'',location.pathname+location.search);}
  priv=sessionStorage.getItem('convosPK');}catch(_){}
$('#nokey').hidden=!!priv;
const room=R.connect({role:'presenter'});

/* una lista plana de pasos. Cada "Siguiente" pasa a la diapositiva siguiente; sus partes se sueltan solas (show.js: auto) */
const flat=[];SHOW.forEach((d,i)=>{for(let k=0;k<(d.steps||1);k++)flat.push({i,k});});
const firstOf=i=>flat.findIndex(x=>x.i===i),lastOf=i=>firstOf(i)+(SHOW[i].steps||1)-1;
const autoOf=(d,k)=>Array.isArray(d.auto)?d.auto[Math.min(k,d.auto.length-1)]:d.auto;
const gap=(d,k)=>{const a=autoOf(d,k);return typeof a==='string'?0:(a||window.CONVOS_AUTO||1.5);};   // 0: esa parte espera un toque
const until=(d,k)=>{while(k<(d.steps||1)-1&&gap(d,k))k++;return k;};   // hasta qué parte llega sola desde k
let autoT=0;
const OPTS={qr:{t:'QR grande',toggle:true},names:{t:'Nombres en el mapa',toggle:true},fill:{t:'Gente de ejemplo',stepper:true},fit:{t:'Encuadrar mapa'},skip:{t:'Saltear escena'}};
let pos=0,fillN=window.CONVOS_FILL||6,names=true,qrBig=false,seq=Date.now(),pubAt=0,real=[],stats={connected:0,screens:[]},net='connecting';
let run=false,tStart=0,acc=0,rst=0,offAt=0;   // rst: hora del último "reiniciar todo"; viaja con cada escena
try{const p=+sessionStorage.getItem('convosPos');if(p>=0&&p<flat.length)pos=p;const q=sessionStorage.getItem('convosFill');if(q!==null&&+q>=0&&+q<=R.FILLERS.length)fillN=+q;
  const r=+sessionStorage.getItem('convosRst');if(Number.isSafeInteger(r)&&r>0)rst=r;}catch(_){}
const elapsed=()=>acc+(run?Date.now()/1000-tStart:0);
const cur=()=>SHOW[flat[pos].i];

async function publish(refit){
  const {k}=flat[pos],f=(names?0:1)|(qrBig?2:0)|(refit?4:0);
  try{sessionStorage.setItem('convosPos',String(pos));sessionStorage.setItem('convosFill',String(fillN));}catch(_){}
  paint();
  if(priv){pubAt=Date.now();try{await room.publishScene(priv,cur().id,k,fillN,f,++seq,rst);}catch(_){}}
  paintTele();
}
/* para ensayar de nuevo: primera escena, tiempo en cero, y los celulares se recargan sin lo que contestaron */
function resetAll(){
  if(!priv||!confirm('¿Reiniciar todo?\n\nVuelve a la primera escena y el tiempo a cero. Los celulares se recargan y olvidan lo que contestaron.'))return;
  rst=Date.now();try{sessionStorage.setItem('convosRst',String(rst));}catch(_){}
  clearTimeout(autoT);pos=0;run=false;acc=0;fillN=window.CONVOS_FILL||6;names=true;qrBig=false;
  publish();
}
function go(p){
  p=Math.max(0,Math.min(flat.length-1,p));
  if(p!==pos&&!run&&p>0)toggleTimer();   // el cronómetro arranca solo con el primer avance
  pos=p;publish();autoStep();
}
/* la diapositiva se arma sola: cada parte sale unos segundos después de la anterior */
function autoStep(){
  clearTimeout(autoT);const {i,k}=flat[pos],d=SHOW[i];
  if(k<(d.steps||1)-1&&gap(d,k))autoT=setTimeout(()=>{pos++;publish();autoStep();},gap(d,k)*1000);
}
/* Siguiente: si la diapositiva todavía se está armando, la muestra entera; si ya está, pasa a lo que sigue
   (casi siempre la diapositiva siguiente; en la encuesta, antes, la frase final). Anterior: la diapositiva anterior, ya entera. */
function next(){
  const {i,k}=flat[pos],d=SHOW[i],u=until(d,k);
  if(u>k)go(pos+u-k);else if(k<(d.steps||1)-1)go(pos+1);else if(i+1<SHOW.length)go(firstOf(i+1));
}
function prev(){const {i}=flat[pos];if(i>0)go(lastOf(i-1));}
function act(id){
  if(id==='qr'){qrBig=!qrBig;publish();}
  else if(id==='names'){names=!names;publish();}
  else if(id==='fill+'){fillN=Math.min(R.FILLERS.length,fillN+1);publish();}
  else if(id==='fill-'){fillN=Math.max(0,fillN-1);publish();}
  else if(id==='fit')publish(true);
  else if(id==='skip')go(firstOf(Math.min(SHOW.length-1,flat[pos].i+1)));
}

/* ---------- cronómetro: el color dice si vas en tiempo ---------- */
function toggleTimer(){if(run){acc=elapsed();run=false;}else{tStart=Date.now()/1000;run=true;}paintTimer();}
function paintTimer(){
  const e=elapsed(),{i,k}=flat[pos],d=SHOW[i];
  const delta=e-(SHOW.slice(0,i).reduce((t,x)=>t+x.secs,0)+d.secs*(k/(d.steps||1)));
  $('#tEl').textContent=mmss(e);$('#tBtn').textContent=run?'Pausar':'Iniciar';
  $('#clock').className='clock'+(!run&&e===0?'':delta>30?' bad':delta>10?' warn':'');
}

/* ---------- la tele avisa qué escena muestra: así se ve si le llegó el último paso ---------- */
function paintTele(){
  const s=stats.screens||[],el=$('#tele');let c,t;
  if(net==='offline'&&Date.now()-offAt<5000){c='warn';t='Reconectando…';}   // un corte de segundos se arregla solo
  else if(net==='offline'){c='bad';t='Sin internet';}
  else if(net==='connecting'){c='warn';t='Conectando…';}
  else if(!s.length){c='bad';t='Tele sin conectar';}
  else if(!priv||s.includes(seq)){c='ok';t='Tele al día';}
  else if(Date.now()-pubAt<6000){c='warn';t='Enviando…';}
  else{c='bad';t='Tele no recibe: recargala';}
  el.className='stat '+c;$('#teleT').textContent=t;
}

/* ---------- pantalla ---------- */
function paint(){
  const {i,k}=flat[pos],d=SHOW[i],steps=d.steps||1,nd=SHOW[i+1],notes=d.notes||[],building=until(d,k)>k,wait=!building&&k<steps-1;
  $('#num').innerHTML='<b>'+(i+1)+'</b> / '+SHOW.length;
  $('#nT').textContent=d.label;
  $('#dots').innerHTML=steps>1?Array.from({length:steps},(_,j)=>'<i class="'+(j<k?'on':j===k?'cur':'')+'"></i>').join(''):'';
  // todo lo que hay que decir en esta diapositiva; lo que todavía no salió, más tenue
  $('#cue').innerHTML=notes.map((n,j)=>'<p'+(steps>1&&j>k?' class="later"':'')+'>'+esc(first(n))+'</p>').join('');
  $('#full').innerHTML=(notes.length?'<ol>'+notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ol>':'')+'<b>Proyector:</b> '+esc(d.proj||'—')+'<br><b>Celular:</b> '+esc(d.cel||'—');
  $('#xT').textContent=building?'se está armando: tocá para verla entera':wait?'sigue: '+autoOf(d,k):nd?'sigue: '+nd.label:'es la última';
  $('#bNext').disabled=!priv||(!building&&!wait&&!nd);$('#bPrev').disabled=!priv||i===0;$('#bReset').disabled=!priv;
  $('#ops').innerHTML=Object.keys(OPTS).map(id=>{const o=OPTS[id],dis=priv?'':' disabled';
    if(o.stepper)return '<span class="op stp'+(fillN?' on':'')+'">'+esc(o.t)+' <button type="button" data-o="fill-"'+dis+' aria-label="Sacar uno">−</button><i>'+fillN+'</i><button type="button" data-o="fill+"'+dis+' aria-label="Sumar uno">+</button></span>';
    const on=id==='qr'?qrBig:id==='names'?names:false;
    return '<button type="button" class="op'+(on?' on':'')+'" data-o="'+id+'"'+dis+'>'+esc(o.t)+(o.toggle?' <i>'+(on?'sí':'no')+'</i>':'')+'</button>';}).join('');
  $('#strip').innerHTML=SHOW.map((x,j)=>'<button type="button" class="chip'+(j===i?' cur':j<i?' past':'')+'" data-i="'+j+'"'+(priv?'':' disabled')+'>'+esc(x.label)+'</button>').join('');
  paintMatch();paintTimer();fit();
}
function fit(){const st=$('.stage');st.classList.remove('many','tight');for(const c of ['many','tight'])if(st.scrollHeight>st.clientHeight+1)st.classList.add(c);}
/* en la pregunta y el match: una línea con lo que hay */
function paintMatch(){
  const d=cur(),show=d.id==='pregunta'||d.id==='match',el=$('#match');el.hidden=!show;if(!show)return;
  const all=real.map(p=>({...p,sim:false})).concat(R.FILLERS.slice(0,fillN)).map(p=>({...p,pt:R.pointOf(p)})).filter(p=>p.pt);
  const g=R.plan(all).groups.length;
  el.innerHTML=g?'<b>'+g+(g===1?' grupo':' grupos')+'</b> · '+real.length+' respondieron':'<b>Todavía no hay match</b> · conviene saltear “Match”';
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='bNext')next();else if(b.id==='bPrev')prev();else if(b.id==='tBtn')toggleTimer();else if(b.id==='bReset')resetAll();
  else if(b.dataset.o)act(b.dataset.o);
  else if(b.dataset.i!==undefined)go(firstOf(+b.dataset.i));
  b.blur();
});
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||!priv)return;
  const k=e.key.toLowerCase();
  if(k==='arrowright'||k==='pagedown'||k===' '||k==='enter'){e.preventDefault();next();}
  else if(k==='arrowleft'||k==='pageup'||k==='backspace'){e.preventDefault();prev();}
  else if(k==='q')act('qr');else if(k==='n')act('names');else if(k==='+'||k==='=')act('fill+');else if(k==='-')act('fill-');else if(k==='e')act('fit');
  else if(k==='p')toggleTimer();
});
room.onPeople(l=>{real=l;paintMatch();});
room.onStats(s=>{stats=s;$('#aCon').textContent=s.connected;paintTele();});
room.onStatus(s=>{s=s==='sim'?'online':s;if(s==='offline'&&net!=='offline')offAt=Date.now();net=s;paintTele();});
room.start();
setInterval(()=>{paintTimer();paintTele();},500);
addEventListener('resize',fit);
const base=new URL('./',location.href);
$('#foot').textContent='Tele: '+new URL('sala.html',base).href+'  ·  Público: '+base.href+'  ·  Teclas: → siguiente · ← anterior · Q QR · N nombres · + / − gente de ejemplo · E encuadrar · P cronómetro';
paint();if(priv){publish();autoStep();}
})();
</script>
</body>
</html>
