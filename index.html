/* Concepto: barra de historia arriba (Día 1, 2, 3, Semana 2, Panel) y un celular al centro que se achica para entrar en pantalla; en celulares la app ocupa todo el ancho.
   Identidad: fondo tinta violeta, encabezados crema redondeados, tarjetas violeta fuerte y degradé naranja a rosa para la acción. Tipografía: Oswald para títulos, Poppins para texto. */
:root{
  --ink:#150B33;--ink-2:#20144A;--ink-3:#2F2166;
  --violet:#6D28D9;--violet-d:#5B21B6;--peri:#818CF8;
  --orange:#FB923C;--rose:#F43F5E;
  --cream:#F5EBDD;--cream-2:#E9DCC6;
  --mint:#34D399;--mute:#B9B1DC;--text:#F5EBDD;--line:rgba(245,235,221,.14);
  --grad:linear-gradient(135deg,#FB923C 0%,#FA6A4D 50%,#F43F5E 100%);
  --fd:'Oswald','Arial Narrow',Impact,sans-serif;
  --fb:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--ink);background-image:radial-gradient(820px 460px at 50% -8%,rgba(109,40,217,.55),transparent 72%),radial-gradient(640px 380px at 100% 100%,rgba(244,63,94,.2),transparent 70%);background-attachment:fixed;color:var(--text);font:400 14px/1.45 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{display:block;flex:none}

/* barra de historia */
.top{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:4px 0 8px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:36px;height:36px;border-radius:12px;background:var(--violet);display:grid;place-items:center;flex:none}
.brand b{display:block;font:600 21px/1 var(--fd);letter-spacing:.03em}
.brand small{display:block;margin-top:3px;font-size:11px;color:var(--mute)}
.pills,.sub{display:flex;flex-wrap:wrap;gap:6px}
.sub{width:100%}
.pills button,.sub button{border:1.5px solid var(--line);background:rgba(255,255,255,.04);padding:8px 14px;border-radius:999px;font:600 12px var(--fb);color:var(--text)}
.sub button{padding:6px 12px;font-size:11.5px;color:var(--mute)}
.pills button.on,.sub button.on{background:var(--grad);border-color:transparent;color:var(--ink)}
.cap{width:100%;font-size:13px;color:var(--mute);max-width:70ch}

/* celular */
.stage{display:flex;justify-content:center;padding:6px 0 12px}
.fit{position:relative;flex:none}
.device{width:414px;height:868px;padding:12px;border-radius:58px;background:#0B0620;box-shadow:0 0 0 2px #3A2C78,0 30px 80px rgba(0,0,0,.55);transform-origin:top left}
.screen{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--ink)}
.screen::after{content:"";position:absolute;top:10px;left:50%;width:112px;height:30px;margin-left:-56px;border-radius:20px;background:#0B0620;z-index:30}
.status{position:absolute;z-index:25;top:0;left:0;right:0;height:46px;padding:15px 30px 0;display:flex;justify-content:space-between;align-items:flex-start;font:600 14px var(--fb);color:var(--ink);pointer-events:none}
.status span:last-child{display:flex;gap:6px;align-items:center;margin-top:3px}
.view{position:absolute;inset:0 0 82px 0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;animation:fade .3s ease}
.view::-webkit-scrollbar{display:none}
.view.full{overflow:hidden;display:flex;flex-direction:column}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}

.tabbar{position:absolute;left:0;right:0;bottom:0;height:82px;z-index:20;background:var(--ink-2);border-radius:28px 28px 0 0;display:flex;justify-content:space-around;padding:10px 10px 0;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.tab{width:78px;height:56px;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;font:600 11px var(--fb)}
.tab[aria-current=page]{background:var(--grad);color:var(--ink)}

/* encabezado crema */
.hdr{background:var(--cream);color:var(--ink);border-radius:0 0 32px 32px;padding:56px 22px 20px;position:relative;z-index:3}
.hdr-main{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font:600 11px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:#6B5A91}
h1{margin-top:2px;font:600 36px/1.04 var(--fd);letter-spacing:.005em}
.hsub{margin-top:6px;font-size:13.5px;color:#4B3E72}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--cream);display:grid;place-items:center;flex:none}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--rose);border:2px solid var(--ink)}
.back{display:inline-flex;align-items:center;gap:2px;margin:-6px 0 8px -8px;border:0;background:none;color:var(--ink);font:600 13px var(--fb);padding:4px 8px 4px 2px}
.pill-ctl{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:0;background:var(--ink);color:var(--cream);border-radius:999px;padding:8px 14px;font:600 12px var(--fb)}

.col{min-height:100%;display:flex;flex-direction:column}
.pad{padding:18px 18px 24px;display:flex;flex-direction:column;gap:14px;flex:1}
.card{background:var(--ink-2);border-radius:24px;padding:16px}
.card-violet{background:var(--violet);color:#fff}
.card-cream{background:var(--cream);color:var(--ink)}
.card-peri{background:var(--peri);color:var(--ink)}
.lbl{font:600 11px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.card-violet .lbl{color:rgba(255,255,255,.75)}
.card-peri .lbl,.card-cream .lbl{color:rgba(21,11,51,.65)}
h2.sec{margin:6px 2px 0;font:600 24px var(--fd);letter-spacing:.01em}
h3{font:600 24px/1.1 var(--fd);letter-spacing:.01em}
small{font-size:12px;color:var(--mute)}
.fine{font-size:12px;color:var(--mute)}
.card-violet .fine,.card-violet small{color:rgba(255,255,255,.78)}
.card-cream small,.card-cream .fine,.card-peri small{color:#4B3E72}
.rowc{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.mt{margin-top:12px}
.quote{font:500 15px/1.5 var(--fb);margin-top:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:15px 22px;font:700 13.5px var(--fb);letter-spacing:.07em;text-transform:uppercase}
.block{width:100%}
.btn-go{background:var(--grad);color:var(--ink);box-shadow:0 10px 24px rgba(244,63,94,.3)}
.btn-violet{background:var(--violet);color:#fff}
.btn-cream{background:var(--cream);color:var(--ink)}
.btn-ink{background:var(--ink);color:var(--cream)}
.btn-ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(245,235,221,.3)}
.btn-ghost-ink{background:rgba(21,11,51,.1);color:var(--ink);border:1.5px solid rgba(21,11,51,.4)}
.btn-sos{background:#E11D48;color:#fff}
.btn-sm{padding:11px 16px;font-size:12px}
.link{border:0;background:none;color:var(--mute);text-decoration:underline;font:500 13px var(--fb);padding:4px;align-self:center}
.cta{position:sticky;bottom:0;display:flex;gap:10px;padding:14px 18px 18px;background:linear-gradient(to top,var(--ink) 64%,rgba(21,11,51,0));z-index:4}
.cta .btn-ghost{padding:14px 16px}

.av{width:var(--s,44px);height:var(--s,44px);border-radius:50%;display:grid;place-items:center;flex:none;font:600 calc(var(--s,44px)*.38) var(--fd);letter-spacing:.02em}
.avs{display:flex}
.avs .av{border:3px solid #FA6A4D;margin-left:-10px}
.avs .av:first-child{margin-left:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;padding:6px 12px;border-radius:999px;background:var(--ink-3);color:var(--cream);font:500 12px var(--fb)}
.chip-ok{background:rgba(52,211,153,.16);color:var(--mint)}
.chip-wait{background:rgba(255,255,255,.18);color:#fff}
.chip-ink{background:var(--ink);color:var(--cream)}
.chip-pe{background:rgba(21,11,51,.12);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.chip.on{background:var(--violet);color:#fff}
.seg{display:flex;background:var(--ink-3);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:9px 4px;white-space:nowrap;border-radius:999px;font:600 12px var(--fb)}
.seg button.on{background:var(--cream);color:var(--ink)}

/* mapa */
.map{position:relative;width:100%;overflow:hidden}
.map>svg{display:block;width:100%;height:100%}
.mk{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:var(--c);color:var(--t);font:600 15px var(--fd);display:grid;place-items:center;padding:0;box-shadow:0 6px 14px rgba(21,11,51,.35)}
.me-dot{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--violet);border:4px solid #fff;box-shadow:0 4px 12px rgba(21,11,51,.4)}
.me-dot::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--violet);animation:ping 2.2s ease-out infinite}
.me-dot b{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:var(--ink);color:var(--cream);font:600 11px var(--fb);padding:3px 9px;border-radius:999px;white-space:nowrap}
.sheetl{position:relative;z-index:4;margin-top:-26px;background:var(--ink);border-radius:30px 30px 0 0;padding:10px 16px 28px;box-shadow:0 -12px 30px rgba(21,11,51,.5)}
.grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--ink-3);margin:2px auto 12px}
.sheetl h2{font:600 22px var(--fd)}
.nbs{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.nb{position:relative;width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--ink-2);border:2px solid transparent;border-radius:22px;padding:12px;color:var(--text)}
.nb.best{background:linear-gradient(var(--ink-2),var(--ink-2)) padding-box,var(--grad) border-box}
.nb .tag{position:absolute;top:-10px;right:14px;background:var(--grad);color:var(--ink);font:700 10px var(--fb);letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.nb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nb-main b{font:600 18px/1.15 var(--fd);letter-spacing:.01em}
.nb-main small{color:var(--mute)}
.nb-main em{font-style:normal;font-size:12px;color:var(--peri)}
.nb-side{display:flex;align-items:center;gap:2px;color:var(--mute)}
.match{background:var(--violet);color:#fff;font:600 12px var(--fb);padding:4px 9px;border-radius:999px}

/* ficha */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--violet);color:#fff;border-radius:20px;padding:12px 6px;text-align:center}
.stat b{display:block;font:600 26px/1.1 var(--fd)}
.stat span{font-size:11px;opacity:.88}
.rowi{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rowi:first-of-type{border-top:0}
.rowi .ico{width:38px;height:38px;border-radius:12px;background:var(--ink-3);display:grid;place-items:center;flex:none;color:var(--peri)}
.rowi b{font-weight:600}

/* hoy */
.hero{background:var(--grad);color:var(--ink);border-radius:28px;padding:18px;position:relative;overflow:hidden}
.hero .lbl{color:rgba(21,11,51,.7)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{margin:8px 0 10px;font:600 34px/1.05 var(--fd)}
.count b{font-size:76px;line-height:.9;padding:0 4px}
.hero h2{margin:8px 0 4px;font:600 40px/1.02 var(--fd)}
.hero p{font-size:13.5px}
.hero-pin{display:flex;align-items:center;gap:6px;margin:12px 0 14px;font-weight:600;font-size:13.5px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-top:14px}
.week{display:flex;justify-content:space-between;margin-top:12px}
.wd{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--fb);border:1.5px solid var(--ink-3);color:var(--mute)}
.wd.done{background:var(--mint);border-color:var(--mint);color:var(--ink)}
.wd.today{border-color:var(--cream);color:var(--cream)}
.tip{display:flex;gap:12px;align-items:flex-start}

/* grupo y chat */
.members{display:flex;justify-content:space-between;gap:8px}
.mem{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.mem b{font:600 16px var(--fd)}
.mem small{font-size:11px}
.free{width:56px;height:56px;border-radius:50%;border:2px dashed var(--mute);display:grid;place-items:center;color:var(--mute)}
.plan{display:flex;flex-direction:column;gap:12px}
.plan-row{display:flex;gap:12px;align-items:center}
.plan-row .ico{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.plan-row small{display:block}
.plan-row b{font:600 17px var(--fd);letter-spacing:.01em}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:84%;padding:10px 13px;border-radius:18px;font-size:13.5px}
.bub.in{background:var(--ink-3);border-bottom-left-radius:6px;align-self:flex-start}
.bub.out{background:var(--peri);color:var(--ink);border-bottom-right-radius:6px;align-self:flex-end}
.bub b{display:block;font-size:11px;color:var(--peri);margin-bottom:1px}
.quick{display:flex;gap:8px;flex-wrap:wrap}

/* en viaje */
.sheetd{position:relative;z-index:4;margin-top:-26px;background:var(--ink);border-radius:30px 30px 0 0;padding:10px 20px 26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -12px 30px rgba(21,11,51,.5)}
.prog{height:8px;border-radius:4px;background:var(--ink-3);overflow:hidden}
.prog i{display:block;height:100%;width:38%;background:var(--grad);border-radius:4px}
.acts{display:flex;gap:10px}
.acts .btn{padding:14px 18px}

/* llegaste */
.big{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--mint);color:var(--ink)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp div{background:var(--ink-3);border-radius:20px;padding:14px;text-align:center}
.cmp div:first-child{background:var(--violet)}
.cmp b{display:block;font:600 34px/1.05 var(--fd)}
.cmp span{font-size:12px;color:rgba(255,255,255,.8)}

/* perfil */
.set{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set p{font-size:13.5px}
.sw{position:relative;display:inline-block;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--ink-3);transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--cream);transition:.2s}
.sw input:checked+span{background:var(--violet)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--orange);outline-offset:2px}
.org .sw span{background:rgba(21,11,51,.2)}
.org .sw input:checked+span{background:var(--violet)}

/* ventanas, aviso y mensaje */
.scrim{position:absolute;inset:0;background:rgba(10,5,28,.62);z-index:40}
.msheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--cream);color:var(--ink);border-radius:32px 32px 0 0;padding:12px 22px 28px;display:flex;flex-direction:column;gap:12px;animation:up .3s ease}
.msheet .grab{background:rgba(21,11,51,.2)}
.msheet h2{font:600 30px/1.05 var(--fd)}
.msheet .lbl{color:#6B5A91}
.msheet .seg{background:rgba(21,11,51,.09)}
.msheet .seg button{color:#4B3E72}
.msheet .seg button.on{background:var(--ink);color:var(--cream)}
.msheet .fine{color:#5A4C80}
.days{display:flex;gap:8px}
.day{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(21,11,51,.28);background:transparent;color:var(--ink);font:600 13px var(--fb)}
.day.on{background:var(--violet);border-color:var(--violet);color:#fff}
.inf{display:flex;gap:10px;align-items:center;font-size:14px}
.note{display:flex;gap:10px;align-items:flex-start;background:rgba(109,40,217,.1);border-radius:16px;padding:12px;font-size:13px;color:#2F2166}
/* aviso oculto del todo: con solo subirlo asomaban su borde y su sombra arriba del celular */
.banner{position:absolute;z-index:50;top:52px;left:12px;right:12px;display:flex;gap:12px;align-items:center;text-align:left;border:0;background:rgba(245,235,221,.97);color:var(--ink);border-radius:22px;padding:12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.4);transform:translateY(-170%);opacity:0;visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .3s ease,visibility 0s linear .45s}
.banner.in{transform:none;opacity:1;visibility:visible;transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .2s ease,visibility 0s}
.banner .app{width:36px;height:36px;border-radius:11px;background:var(--violet);display:grid;place-items:center;flex:none}
.banner .bt{display:flex;flex-direction:column;font-size:13px;line-height:1.3}
.banner .bt b{font:600 12px var(--fb);color:#6B5A91}
.banner small{margin-left:auto;align-self:flex-start;color:#6B5A91}
.toast{position:absolute;z-index:60;left:50%;bottom:100px;max-width:340px;transform:translate(-50%,20px);background:var(--cream);color:var(--ink);font:600 13px/1.35 var(--fb);padding:10px 16px;border-radius:20px;text-align:center;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.toast.in{opacity:1;transform:translate(-50%,0)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 8px}

/* panel de la organización */
.org{max-width:1040px;margin:6px auto 28px;display:flex;flex-direction:column;gap:14px}
.org-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;background:var(--cream);color:var(--ink);border-radius:28px;padding:22px 24px}
.org-head h1{font-size:46px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--violet);color:#fff;border-radius:24px;padding:18px}
.kpi:nth-child(2){background:var(--ink-3)}
.kpi:nth-child(3){background:var(--grad);color:var(--ink)}
.kpi:nth-child(4){background:var(--peri);color:var(--ink)}
.kpi b{display:block;font:600 50px/1 var(--fd);margin-bottom:4px}
.kpi span{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.panel{border-radius:24px;padding:20px}
.panel.cream{background:var(--cream);color:var(--ink)}
.panel.dark{background:var(--ink-2)}
.panel h2{font:600 26px var(--fd)}
.panel .fine{margin-top:4px}
.cream .fine{color:#4B3E72}
.bar{display:grid;grid-template-columns:minmax(110px,150px) 1fr auto;gap:10px;align-items:center;margin-top:14px;font-size:13px}
.bar i{display:block;height:12px;border-radius:6px;background:rgba(21,11,51,.12)}
.bar u{display:block;height:100%;border-radius:6px;background:var(--grad)}
.bar span:last-child{text-align:right;font-weight:600;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.tbl th{text-align:left;font:600 11px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:6px 6px 6px 0}
.tbl td{padding:10px 6px 10px 0;border-top:1px solid var(--line)}
.ben{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(21,11,51,.14)}
.ben:first-of-type{border-top:0}
.ben b{display:block;font-weight:600}
.ben small{color:#4B3E72}

@media (max-width:520px){
  .stage{padding-top:2px}
  .device{width:100%;height:auto;padding:0;background:none;box-shadow:none;border-radius:0;transform:none!important}

  .screen{width:100%;height:max(600px,calc(100dvh - 230px));border-radius:30px}

  .bar{grid-template-columns:96px 1fr auto}

}

.badge-g{flex:none;background:var(--ink);color:var(--mint);font:600 18px var(--fd);padding:5px 10px;border-radius:12px}

/* chat */
.typing{display:flex;gap:4px;padding:13px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.composer{display:flex;gap:8px;margin-top:4px}
.composer input{flex:1;min-width:0;border:1.5px solid var(--ink-3);background:var(--ink-2);color:var(--cream);border-radius:999px;padding:12px 16px;font:400 16px var(--fb)}
.composer button{width:46px;height:46px;border:0;border-radius:50%;background:var(--grad);color:var(--ink);display:grid;place-items:center;flex:none}

/* formularios en hojas */
.msheet.tall{max-height:92%;overflow-y:auto;scrollbar-width:none}
.fl{display:flex;flex-direction:column;gap:5px;font:600 11px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:#6B5A91}
.fl small{float:right;letter-spacing:0;color:#6B5A91}
.fl input,.fl select,.fl textarea{font:400 16px var(--fb);letter-spacing:0;text-transform:none;color:var(--ink);background:#fff;border:1.5px solid rgba(21,11,51,.18);border-radius:14px;padding:11px 12px;resize:none;width:100%}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.sugg button{border:0;background:rgba(21,11,51,.08);color:var(--ink);border-radius:999px;padding:5px 10px;font:500 11.5px var(--fb)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--ink-3);border-top-color:var(--orange);animation:rot 1s linear infinite;margin-top:220px}
@keyframes rot{to{transform:rotate(360deg)}}
.org .orgmap .leaflet-control-attribution{font-size:9px}


.card-peri .fine{color:#2F2166}
.bar.dk i{background:rgba(245,235,221,.1)}
@media (max-width:520px){.cap{display:none}.screen{height:max(600px,calc(100dvh - 140px))!important}}

/* sala en vivo: el público no ve la barra de historia, la maneja el presentador */
body.aud .top{display:none}
body.aud .stage{padding-top:10px}
.jlive{display:inline-flex;align-items:center;gap:6px}
.view.comp{inset:0}
.comp{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:64px 26px 44px;text-align:center}
.comp h2{font:600 clamp(30px,9vw,40px)/1.1 var(--fd)}
.comp .ck{font:600 11px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.comp .cs{font-size:15px;color:var(--mute);max-width:26ch}
.comp small{color:var(--mute)}
.comp .clogo{width:112px;height:112px;animation:look 3.2s ease-in-out infinite}   /* el auto anda en el lugar mientras mirás al frente */
.comp .clogo .body{animation:ride .7s ease-in-out infinite alternate}
.comp .clogo .spd{animation:spd .5s ease-in-out infinite alternate}
@keyframes look{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ride{to{transform:translateY(-1.5px)}}
@keyframes spd{to{transform:translateX(-3px)}}
.opts{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{border:1.5px solid var(--line);background:var(--ink-2);border-radius:20px;padding:16px;font:600 16px var(--fb);color:var(--cream)}
.opt.on{background:var(--grad);border-color:transparent;color:var(--ink)}
/* celulares (Android y iPhone): arrastrar hacia abajo no recarga la página, tocar no deja un recuadro azul y las letras no se agrandan solas */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
.view,.msheet.tall{overscroll-behavior:contain}
.opt:active,.btn:active{filter:brightness(.9)}

let G=null;const SPEED=[85,70,42,34,28,45,30,18];
function loadGraph(j){
  const n=j.n.length/2,lat=new Float64Array(n),lon=new Float64Array(n);for(let i=0;i<n;i++){lon[i]=j.n[2*i]/1e5;lat[i]=j.n[2*i+1]/1e5;}
  const m=j.e.length,ea=new Int32Array(m),eb=new Int32Array(m),el=new Float32Array(m),ew=new Float32Array(m),et=new Array(m),eg=new Array(m),deg=new Int32Array(n+1);
  j.e.forEach((e,k)=>{ea[k]=e[0];eb[k]=e[1];el[k]=e[2];et[k]=e[5];eg[k]=e[6];ew[k]=e[2]/(SPEED[e[3]]/3.6);deg[e[0]+1]++;deg[e[1]+1]++;});
  for(let i=0;i<n;i++)deg[i+1]+=deg[i];
  const fill=deg.slice(0,n),adjE=new Int32Array(2*m),adjN=new Int32Array(2*m);
  for(let k=0;k<m;k++){adjE[fill[ea[k]]]=k;adjN[fill[ea[k]]++]=eb[k];adjE[fill[eb[k]]]=k;adjN[fill[eb[k]]++]=ea[k];}
  const grid=new Map();for(let i=0;i<n;i++){const key=Math.floor(lat[i]*100)+':'+Math.floor(lon[i]*100);if(!grid.has(key))grid.set(key,[]);grid.get(key).push(i);}
  G={n,lat,lon,ea,eb,el,ew,et,eg,start:deg,adjE,adjN,grid};
}
function snap(pt){const la=Math.floor(pt[0]*100),lo=Math.floor(pt[1]*100);let best=-1,bd=1e9;
  for(let r=0;r<6&&best<0;r++){for(let a=la-r;a<=la+r;a++)for(let b=lo-r;b<=lo+r;b++){const arr=G.grid.get(a+':'+b);if(!arr)continue;for(const i of arr){const d=(G.lat[i]-pt[0])**2+((G.lon[i]-pt[1])*0.82)**2;if(d<bd){bd=d;best=i}}}}return best;}
function dijkstra(src,target=-1){
  const n=G.n,dist=new Float64Array(n).fill(Infinity),pe=new Int32Array(n).fill(-1),pn=new Int32Array(n).fill(-1),hk=[],hv=[];
  const push=(k,v)=>{let i=hk.length;hk.push(k);hv.push(v);while(i>0){const p=(i-1)>>1;if(hk[p]<=k)break;hk[i]=hk[p];hv[i]=hv[p];i=p;}hk[i]=k;hv[i]=v;};
  const pop=()=>{const k=hk[0],v=hv[0],lk=hk.pop(),lv=hv.pop();if(hk.length){let i=0;const L=hk.length;while(true){let l=2*i+1,r=l+1,s=i,sk=lk;if(l<L&&hk[l]<sk){s=l;sk=hk[l]}if(r<L&&hk[r]<sk){s=r}if(s===i)break;hk[i]=hk[s];hv[i]=hv[s];i=s;}hk[i]=lk;hv[i]=lv;}return [k,v];};
  dist[src]=0;push(0,src);
  while(hk.length){const[d,u]=pop();if(d>dist[u])continue;if(u===target)break;for(let k=G.start[u];k<G.start[u+1];k++){const e=G.adjE[k],v=G.adjN[k],nd=d+G.ew[e];if(nd<dist[v]){dist[v]=nd;pe[v]=e;pn[v]=u;push(nd,v);}}}
  return {dist,pe,pn,src};
}
function walk(t,x){const steps=[];let len=0,time=0;const tolls=new Set();while(x!==t.src&&t.pe[x]>=0){const e=t.pe[x],to=t.pn[x];steps.push([e,x,to]);len+=G.el[e];time+=G.ew[e];if(G.et[e])tolls.add(G.et[e]);x=to;}return {steps,len,time,tolls};}
function geomOf(steps){const out=[];steps.forEach(([e,a,b],i)=>{const g=G.eg[e],mids=[];for(let k=0;k<g.length;k+=2)mids.push([g[k+1]/1e5,g[k]/1e5]);if(a!==G.ea[e])mids.reverse();if(i===0)out.push([G.lat[a],G.lon[a]]);out.push(...mids,[G.lat[b],G.lon[b]]);});return out;}
const TC=new Map();function tree(n){if(!TC.has(n)){if(TC.size>10)TC.delete(TC.keys().next().value);TC.set(n,dijkstra(n));}return TC.get(n);}
const LC=new Map();function leg(a,b){const k=a+'>'+b;if(!LC.has(k)){const t=TC.get(b)||dijkstra(b,a);const w=walk(t,a);LC.set(k,{...w,geom:geomOf(w.steps)});}return LC.get(k);}
function toSede(a){const k=a+'>S'+S.me.sede;if(!LC.has(k)){const w=walk(tree(sedeNode()),a);LC.set(k,{...w,geom:geomOf(w.steps)});}return LC.get(k);}
const sedeNode=()=>SEDES[S.me.sede].node;
function nearestLoc(pt){let b=null,bd=1e9;LOCS.forEach(l=>{const d=hav(pt,l.pt);if(d<bd){bd=d;b=l}});return b.name;}

function makeModel(driver,pax){
  const dS=tree(sedeNode()).dist;const order=[...pax].sort((a,b)=>dS[b.node]-dS[a.node]);const nodes=[driver.node,...order.map(p=>p.node)];
  let len=0,time=0;const tolls=new Set(),geom=[],at=[];
  for(let i=0;i<nodes.length;i++){const Lg=i<nodes.length-1?leg(nodes[i],nodes[i+1]):toSede(nodes[i]);if(i>0)at.push({len,time,pt:geom.length});len+=Lg.len;time+=Lg.time;Lg.tolls.forEach(t=>tolls.add(t));geom.push(...Lg.geom);}
  const pico=isPico(S.me.arr),fac=pico?1.35:1.05,km=len/1000,drive=time/60*fac,minutes=drive+3*pax.length+3;
  const arrive=toMin(S.me.arr),dep=Math.floor((arrive-minutes)/5)*5,car=driver.car,energy=km*car.cons/100*P_(car.fuel);
  const tl=[...tolls].map(k=>({k,label:PARAMS[k].label,v:pico?PARAMS[k].v:PARAMS[k].v2}));const tollT=tl.reduce((s,t)=>s+t.v,0),total=energy+tollT,n=1+pax.length;
  const stops=[{o:driver,t:dep}];order.forEach((p,i)=>stops.push({o:p,t:dep+at[i].time/60*fac+3*i}));stops.push({o:null,t:arrive});
  return {driver,pax:order,geom,km,minutes,dep,arrive,energy,tolls:tl,tollT,total,share:total/n,n,stops,car,pico,kg:km*car.cons/100*EF[car.fuel]};
}

function applyScene(sc){
  if(!sc)return;
  if(!S.ready){   // el mapa todavía está bajando: se guarda la escena; votar y los mensajes se muestran igual
    ROOM.last=sc;if(Number.isInteger(sc.fill))ROOM.fillN=sc.fill;
    const d=SHOWBY[sc.s];if(!MIRROR&&d&&d.view==='slide'&&d.id!=='match'&&d.id!=='cierre')showComp({id:d.id,def:d,big:(d.phone&&d.phone.text)||'',sub:(d.phone&&d.phone.sub)||''});
    return;
  }
  const prev=ROOM.last;ROOM.last=sc;if(Number.isInteger(sc.fill))ROOM.fillN=sc.fill;
  if(prev&&prev.s===sc.s){if(prev.fill!==sc.fill&&S.world==='room'){computeWorld();render(true);}return;}
  S.world=(sc.s==='red'||sc.s==='cierre')?'room':'classic';
  computeWorld();S.swiped={};
  switch(sc.s){
    case 'inicio':story('d1');setTab('home');render();break;
    case 'cerca':story('d1');break;
    case 'swipe':story('d1');setTab('near','swipe');render();break;
    case 'viajes':story('d2');setTab('trips');render();break;
    case 'viaje':story('d3','driving');break;

    case 'pregunta':if(!MIRROR){if(ROOM.joined)toast('Ya estás en la sala. Mirá la pantalla grande.');else{S.modal='join';render(true);}}break;
    case 'red':story('d1');setTab('near','red');render();break;

  }
}

function computeWorld(){
  const o=LOC(S.me.origin)||LOCS[0];S.me.pt=o.pt;S.me.node=snap(o.pt);
  Object.values(SEDES).forEach(s=>{if(s.node==null)s.node=snap(s.pt)});
  const u=S.me.node,dS=tree(sedeNode()).dist,dU=tree(u).dist,r=rng32(hashStr(S.me.origin+S.me.sede+S.me.arr)),used=[S.me.pt];
  const fac=isPico(S.me.arr)?1.35:1.05;
  const pickNode=f=>{const pool=[];for(let i=0;i<G.n;i+=2){if(isFinite(dU[i])&&isFinite(dS[i])&&f(i))pool.push(i);}
    for(let k=0;k<500&&pool.length;k++){const i=pool[Math.floor(r()*pool.length)],pt=[G.lat[i],G.lon[i]];if(used.every(q=>hav(q,pt)>0.6)){used.push(pt);return i;}}return -1;};
  const myDays=S.me.days.filter(Boolean).length||1;
  S.people=(S.world==='room'?roomCast():CAST).map(c=>{
    let node=c.pt?snap(c.pt):-1;
    if(c.kind==='up'){const lo=60+c.rank*110,hi=260+c.rank*160;node=pickNode(i=>dS[i]>dS[u]+90&&dS[i]<dS[u]+540&&dU[i]>100&&(dU[i]+dS[u]-dS[i])>=lo&&(dU[i]+dS[u]-dS[i])<=hi);}
    if(node<0)node=pickNode(i=>{const d=hav(S.me.pt,[G.lat[i],G.lon[i]]);return d>0.5&&d<3.2;});
    if(node<0)node=u;
    const pt=[G.lat[node],G.lon[node]],km=hav(S.me.pt,pt),loc=c.loc||nearestLoc(pt);
    let det=null;
    if(c.drives&&!S.me.car)det=Math.max(1,Math.round((dU[node]+dS[u]-dS[node])/60*fac));
    else if(!c.drives&&S.me.car)det=Math.max(1,Math.round((dU[node]+dS[node]-dS[u])/60*fac));
    const sede=c.sede||S.me.sede,overlap=c.days.filter((v,i)=>v&&S.me.days[i]).length;
    const parts={ruta:det!=null?clamp(100-det*5,20,100):clamp(Math.round(100-km*14),20,100),horario:clamp(100-Math.abs(c.arr)/15*14,20,100),sede:sede===S.me.sede?100:(sede!=='fin'&&S.me.sede!=='fin'?85:40),dias:Math.round(overlap/myDays*100)};
    let match=Math.round(.4*parts.ruta+.3*parts.horario+.2*parts.dias+.1*parts.sede);
    if(!c.drives&&!S.me.car)match-=8;
    match=clamp(match,40,98);
    const at=hhmm(toMin(S.me.arr)+c.arr),kmT=nf(km,1);

      :(!c.drives&&S.me.car?'Vive a '+kmT+' km y te suma +'+det+' min.':'También busca lugar y vive a '+kmT+' km.');
    return {...c,node,pt,km,kmT,loc,det,sede,overlap,parts,match,at,why,meet:'Estación '+loc};
  }).sort((a,b)=>b.match-a.match);
  if(!S.me.days[S.day])S.day=Math.max(0,S.me.days.findIndex(Boolean));
}
const visible=()=>S.people.filter(p=>p.days[S.day]&&(S.filter==='todos'||(S.filter==='maneja'&&p.drives)||(S.filter==='necesita'&&!p.drives))&&(S.role==='all'||p.role===S.role));

function miniRoute(m,ghost,hl){
  const gw=thin(m.geom,180),ga=ghost?thin(ghost.geom,180):[],sd=SEDES[S.me.sede].pt,k=Math.cos(34.6*Math.PI/180);
  const all=[...gw,...ga,sd];let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;all.forEach(p=>{const x=p[1]*k,y=-p[0];x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});
  const W=340,pad=22,H=Math.round(clamp((W-2*pad)*((y1-y0)/((x1-x0)||1e-3))+2*pad,120,210)),sc=Math.min((W-2*pad)/((x1-x0)||1e-3),(H-2*pad)/((y1-y0)||1e-3)),ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;
  const Pp=p=>[(p[1]*k-x0)*sc+ox,(-p[0]-y0)*sc+oy],path=g=>g.map((p,i)=>{const[x,y]=Pp(p);return(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join('');
  const[sx,sy]=Pp(sd);
  const dots=m.stops.slice(0,-1).map(s=>{const[x,y]=Pp(s.o.pt);return '<circle cx="'+x+'" cy="'+y+'" r="'+(s.o.me?7:6)+'" fill="'+s.o.bg+'" stroke="#fff" stroke-width="2.5"/>';}).join('');
  return '<svg class="mini" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Recorrido de '+nf(m.km,1)+' km"><rect width="'+W+'" height="'+H+'" rx="18" fill="#FFFDF8"/>'+
    (ga.length?'<path d="'+path(ga)+'" fill="none" stroke="#B9B1DC" stroke-width="2.5" stroke-dasharray="4 5" stroke-linecap="round"/>':'')+
    '<path d="'+path(gw)+'" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="'+path(gw)+'" fill="none" stroke="url(#mg)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#F43F5E"/></linearGradient></defs>'+
    dots+'<rect x="'+(sx-7)+'" y="'+(sy-7)+'" width="14" height="14" rx="4" fill="#150B33" stroke="#fff" stroke-width="2.5"/>'+
    (function(){const s0=m.stops[0].o,[x,y]=Pp(s0.pt),lab=s0.me?S.me.origin:(s0.loc||'');const t=(tx,ty,str)=>'<text x="'+tx+'" y="'+ty+'" text-anchor="'+(tx>W/2?'end':'start')+'" style="font:600 10.5px Poppins,sans-serif;fill:#4B3E72;paint-order:stroke;stroke:#FFFDF8;stroke-width:3px">'+str+'</text>';
      return t(x>W/2?x-10:x+10,y+4,lab)+t(sx>W/2?sx-11:sx+11,sy+4,'ITBA');})()+'</svg>';
}
function thin(g,n){if(g.length<=n)return g;const st=g.length/n,o=[];for(let i=0;i<g.length;i+=st)o.push(g[Math.floor(i)]);o.push(g[g.length-1]);return o;}

function loadBlock(g,bx,by){const k=g+'_'+bx+'_'+by;if(!MAN[g]||!MAN[g].has(bx+'_'+by))return Promise.resolve(null);return blockCache[k]||(blockCache[k]=fetch('t/'+k+'.json').then(r=>r.ok?r.json():null).catch(()=>null));}
async function tileImg(g,x,y){const key=g+'/'+x+'/'+y;if(key in imgCache)return imgCache[key];const b=await loadBlock(g,x>>3,y>>3);const s=b&&b[x+','+y];if(!s){imgCache[key]=null;return null;}const im=new Image();im.src='data:image/webp;base64,'+s;try{await im.decode()}catch(_){}imgCache[key]=im;return im;}
const Tiles=L.GridLayer.extend({createTile(c,done){const cv=document.createElement('canvas');cv.width=cv.height=512;const ctx=cv.getContext('2d');ctx.fillStyle='#A9CEEF';ctx.fillRect(0,0,512,512);
  (async()=>{const g=c.z-1;for(let gg=Math.min(g,14);gg>=8;gg--){const d=g-gg;const im=await tileImg(gg,c.x>>d,c.y>>d);if(im){const sz=512/(1<<d);ctx.drawImage(im,(c.x&((1<<d)-1))*sz,(c.y&((1<<d)-1))*sz,sz,sz,0,0,512,512);break;}}done(null,cv);})();return cv;}});

  el.addEventListener('pointermove',e=>{if(x0===null)return;const sc=el.getBoundingClientRect().width/el.offsetWidth||1;const mx=(e.clientX-x0)/sc,my=(e.clientY-y0)/sc;if(!drag&&Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)){drag=true;el.setPointerCapture(e.pointerId);}if(drag){dx=mx;set();}});
  const up=()=>{if(x0===null)return;x0=null;if(!drag)return;if(Math.abs(dx)>90)fly(dx>0?'right':'left');else{el.style.transition='transform .25s';dx=0;set();}};

function botReply(t){
  const g=G0(),m=groupModel(g),drv=P(g.drv),who=drv.id==='me'?first(g.riders.find(x=>x!=='me')):first(drv.id),n=norm(t),pp=drv.id==='me'?P(g.riders.find(x=>x!=='me')):drv;

  let r;
  if(/perfecto|dale|genial|gracias/.test(n))r='¡Genial! Nos vemos el '+DN[g.days[0]]+'.';
  else if(/mate/.test(n))r=pp.mate?'Siempre llevo mate, el termo lo pongo yo.':'No tomo mate, pero no me molesta.';
  else if(/musica|tema|spotify/.test(n))r='Suelo poner '+pp.music.toLowerCase()+', pero si preferís otra cosa la cambiamos.';
  else if(/plata|cuanto|pone|aporte|peaje|nafta/.test(n))r='La app lo divide sola: '+money(m.share)+' por tramo cada uno, nafta y peajes incluidos.';
  else if(/hora|tarde|cambiar/.test(n))r='Si algún día cambia el horario, avisá por acá y lo movemos.';
  else if(/parcial|examen|materia/.test(n))r='Si tenés parcial, repasamos en el auto. ¡Suerte!';

  return {who:W,t:r};
}

document.addEventListener('submit',e=>{if(e.target.id!=='composer')return;e.preventDefault();const i=$('#chatIn');const t=i.value.trim();if(!t)return;i.value='';say(t);});
document.addEventListener('keydown',e=>{
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&$('#topCard')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!S.modal){e.preventDefault();fly(e.key==='ArrowRight'?'right':'left');}
  if(e.key==='Escape'&&S.modal&&S.modal!=='join')modal(null);
});

/* ---------- tamaño ---------- */
function fit(){
  const dev=$('#device'),box=$('#fit');
  if(window.innerWidth<=520){dev.style.transform='';box.style.width='';box.style.height='';if(MAP)MAP.invalidateSize();return;}
  const top=$('.top').getBoundingClientRect().height,s=Math.max(.45,Math.min(MIRROR?1.4:1,(window.innerHeight-top-40)/868));
  dev.style.transform='scale('+s+')';box.style.width=(414*s)+'px';box.style.height=(868*s)+'px';
}
window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe($('.top'));

/* ---------- arranque ---------- */
function boot(){
  story('d1');
  if(AUD&&!MIRROR)startRoom();   // el público entra a la sala enseguida: puede votar mientras baja el mapa
  const get=n=>fetch('graph.json').then(r=>{if(!r.ok)throw new Error('graph');return r.json();}).catch(e=>{if(n>0)return new Promise(ok=>setTimeout(ok,1500)).then(()=>get(n-1));throw e;});
  get(2).then(j=>{loadGraph(j);computeWorld();S.ready=true;
    const h=(location.hash||'').replace('#','');const m={d1:['d1'],d2:['d2'],d3:['d3','soon'],w2:['w2'],org:['org']};
    if(m[h])story(m[h][0],m[h][1]);else story('d1');
    if(AUD){if(MIRROR)startRoom();else{const sc=ROOM.last;ROOM.last=null;applyScene(sc||{s:START,fill:ROOM.fillN});}}
  }).catch(()=>{if(S.screen!=='comp')$('#view').innerHTML='<div class="pad"><p class="fine">No pudimos cargar el mapa. Recargá la página.</p></div>';});
}
boot();
})();

</script>
